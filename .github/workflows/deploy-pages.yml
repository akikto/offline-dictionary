name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/sync-pwa-root.mjs
      - name: Commit PWA assets for legacy Pages root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json icon.png logo.png pwa-192.png pwa-512.png favicon.png favicon.ico apple-touch-icon.png icon.svg sw.js .well-known/assetlinks.json
          if git diff --staged --quiet; then
            echo "No PWA root asset changes to commit"
          else
            git commit -m "Deploy PWA root assets [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy full site to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          single-commit: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
